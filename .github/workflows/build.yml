name: Build

# Filet de sécurité : le project.pbxproj est écrit à la main, ce job confirme
# que le projet compile réellement sur un vrai toolchain Xcode / simulateur iOS.
on:
  push:
  pull_request:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: >
          xcodebuild
          -project GentleMatesWidget.xcodeproj
          -scheme GentleMatesWidget
          -destination 'platform=iOS Simulator,name=iPhone 15'
          CODE_SIGNING_ALLOWED=NO
          build
